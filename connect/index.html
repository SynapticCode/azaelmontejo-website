<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect — Azael Montejo Jr.</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body class="antialiased !bg-[#0a0a0a] text-white">
  <div id="navbar-container"></div>

  <main class="min-h-screen bg-[#0a0a0a] text-white px-4 sm:px-6 pb-20">
    <section class="pt-32 pb-12 text-center">
      <h1 class="text-4xl md:text-5xl font-black tracking-tight">Connect</h1>
      <p class="mt-3 text-lg text-gray-400">Find me on the internet.</p>
    </section>

    <div class="max-w-lg mx-auto space-y-3">
      <a
        href="https://github.com/SynapticCode"
        target="_blank"
        rel="noopener noreferrer"
        class="group flex w-full items-center gap-4 rounded-lg border border-[#2a2a2a] bg-[#1a1a1a] px-4 py-4 text-left text-white transition hover:-translate-y-0.5 hover:border-[#3a3a3a] hover:bg-[#222] hover:shadow-lg"
      >
        <span class="flex h-9 w-9 shrink-0 items-center justify-center text-xl text-gray-300 group-hover:text-white" aria-hidden="true">
          <i class="fa-brands fa-github"></i>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold">GitHub</span>
          <span class="block truncate text-sm text-gray-400 group-hover:text-gray-300">github.com/SynapticCode</span>
        </span>
      </a>

      <a
        href="https://linkedin.com/in/azaelmontejo"
        target="_blank"
        rel="noopener noreferrer"
        class="group flex w-full items-center gap-4 rounded-lg border border-[#2a2a2a] bg-[#1a1a1a] px-4 py-4 text-left text-white transition hover:-translate-y-0.5 hover:border-[#3a3a3a] hover:bg-[#222] hover:shadow-lg"
      >
        <span class="flex h-9 w-9 shrink-0 items-center justify-center text-xl text-[#0a66c2]" aria-hidden="true">
          <i class="fa-brands fa-linkedin"></i>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold">LinkedIn</span>
          <span class="block truncate text-sm text-gray-400 group-hover:text-gray-300">linkedin.com/in/azaelmontejo</span>
        </span>
      </a>

      <a
        href="https://instagram.com/azaelmontejo"
        target="_blank"
        rel="noopener noreferrer"
        class="group flex w-full items-center gap-4 rounded-lg border border-[#2a2a2a] bg-[#1a1a1a] px-4 py-4 text-left text-white transition hover:-translate-y-0.5 hover:border-[#3a3a3a] hover:bg-[#222] hover:shadow-lg"
      >
        <span class="flex h-9 w-9 shrink-0 items-center justify-center text-xl text-pink-500" aria-hidden="true">
          <i class="fa-brands fa-instagram"></i>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold">Instagram</span>
          <span class="block truncate text-sm text-gray-400 group-hover:text-gray-300">instagram.com/azaelmontejo</span>
        </span>
      </a>

      <a
        href="https://x.com/azaelmontejo"
        target="_blank"
        rel="noopener noreferrer"
        class="group flex w-full items-center gap-4 rounded-lg border border-[#2a2a2a] bg-[#1a1a1a] px-4 py-4 text-left text-white transition hover:-translate-y-0.5 hover:border-[#3a3a3a] hover:bg-[#222] hover:shadow-lg"
      >
        <span class="flex h-9 w-9 shrink-0 items-center justify-center text-xl text-gray-200" aria-hidden="true">
          <i class="fa-brands fa-x-twitter"></i>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold">Twitter / X</span>
          <span class="block truncate text-sm text-gray-400 group-hover:text-gray-300">x.com/azaelmontejo</span>
        </span>
      </a>

      <a
        href="mailto:azael@azaelmontejo.com"
        class="group flex w-full items-center gap-4 rounded-lg border border-[#2a2a2a] bg-[#1a1a1a] px-4 py-4 text-left text-white transition hover:-translate-y-0.5 hover:border-[#3a3a3a] hover:bg-[#222] hover:shadow-lg"
      >
        <span class="flex h-9 w-9 shrink-0 items-center justify-center text-xl text-gray-300 group-hover:text-white" aria-hidden="true">
          <i class="fa-solid fa-envelope"></i>
        </span>
        <span class="min-w-0 flex-1">
          <span class="block font-semibold">Email</span>
          <span class="block truncate text-sm text-gray-400 group-hover:text-gray-300">azael@azaelmontejo.com</span>
        </span>
      </a>
    </div>

    <section class="max-w-lg mx-auto mt-16 pt-12 border-t border-[#2a2a2a]">
      <h2 class="text-2xl font-bold text-center">Or just say hi</h2>
      <p class="mt-2 text-center text-gray-400 text-sm">Drop a note — I will get back to you when I can.</p>

      <form class="mt-8 space-y-4" action="https://formspree.io/f/mnjgkgpy" method="POST">
        <div>
          <label for="connect-name" class="mb-1.5 block text-sm font-medium text-gray-300">Name</label>
          <input
            type="text"
            id="connect-name"
            name="name"
            autocomplete="name"
            class="w-full rounded-lg border border-[#2a2a2a] bg-[#111111] px-3 py-2.5 text-white placeholder:text-gray-600 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-purple-600/50"
            placeholder="Your name"
          >
        </div>
        <div>
          <label for="connect-email" class="mb-1.5 block text-sm font-medium text-gray-300">Email</label>
          <input
            type="email"
            id="connect-email"
            name="email"
            autocomplete="email"
            class="w-full rounded-lg border border-[#2a2a2a] bg-[#111111] px-3 py-2.5 text-white placeholder:text-gray-600 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-purple-600/50"
            placeholder="you@example.com"
          >
        </div>
        <div>
          <label for="connect-message" class="mb-1.5 block text-sm font-medium text-gray-300">Message</label>
          <textarea
            id="connect-message"
            name="message"
            rows="5"
            class="w-full resize-y rounded-lg border border-[#2a2a2a] bg-[#111111] px-3 py-2.5 text-white placeholder:text-gray-600 focus:border-transparent focus:outline-none focus:ring-2 focus:ring-purple-600/50"
            placeholder="Your message..."
          ></textarea>
        </div>
        <button
          type="submit"
          class="w-full rounded-lg bg-[#4F00BC] px-4 py-3 font-semibold text-white transition hover:bg-[#2d1a4a] focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-[#0a0a0a]"
        >
          Send
        </button>
      </form>
    </section>
  </main>

  <div id="footer-container"></div>
  <script src="/scripts/components.js"></script>
</body>
</html>
